name: Deploy

on:
  push:
    branches: [ main ]
  schedule:
    # Monday 09:00 Asia/Seoul (UTC+9).
    - cron: '0 0 * * 1'

permissions:
    contents: read

jobs:
  test:
    name: Format, Vet, Test, Build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"

          if [[ -n "$unformatted" ]]; then
          echo "다음 파일에 gofmt가 필요합니다:"
          echo "$unformatted"
          exit 1
          fi
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -o /tmp/dicoco ./cmd/bot

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-24.04-arm

    env:
      IMAGE_URI: ${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_IMAGE }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to OCIR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.OCIR_REGISTRY }}
          username: ${{ vars.OCIR_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Set weekly deployment tag
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          printf 'IMAGE_TAG=%s-weekly-%s-%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Resolve latest OpenCode
        id: opencode
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://opencode.ai/update/api/latest/cli/npm |
            python3 -c 'import json,re,sys; v=json.load(sys.stdin)["version"]; re.fullmatch(r"2\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?",v) or sys.exit("Invalid OpenCode v2 version"); print("version="+v)' >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          build-args: |
            OPENCODE_VERSION=${{ steps.opencode.outputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_URI }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate GitOps diagnostic token
        id: gitops-check-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: 'Iv23lijiSk5hqJhw5DsY'
          private-key: ${{ secrets.DEPLOYER_APP_PRIVATE_KEY }}
          owner: wafflestudio
          repositories: waffle-world-oci
          permission-contents: write

      - name: Check GitOps push access
        env:
          GITOPS_CHECK_TOKEN: ${{ steps.gitops-check-token.outputs.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GITOPS_CHECK_TOKEN"]
          basic = base64.b64encode(("x-access-token:" + token).encode()).decode()
          checks = [
              ("Repository API", "https://api.github.com/repos/wafflestudio/waffle-world-oci", "Bearer " + token),
              ("Git push authentication", "https://github.com/wafflestudio/waffle-world-oci.git/info/refs?service=git-receive-pack", "Basic " + basic),
          ]
          failed = False
          for label, url, authorization in checks:
              request = urllib.request.Request(url, headers={
                  "Authorization": authorization,
                  "User-Agent": "dicoco-deploy-check",
              })
              try:
                  response = urllib.request.urlopen(request, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              except urllib.error.URLError:
                  print(f"::error::{label}: connection failed", flush=True)
                  failed = True
                  continue
              with response:
                  status = response.code
                  request_id = response.headers.get("X-GitHub-Request-Id", "unavailable")
                  print(f"{label}: HTTP {status}; GitHub request ID: {request_id}", flush=True)
                  if status != 200:
                      failed = True
          if failed:
              raise SystemExit("GitOps access check failed; no repository changes were made by this check.")
          PY

      - name: Update GitOps image tag
        uses: wafflestudio/waffle-world-oci/.github/actions/update-image@main
        with:
          image: ${{ env.IMAGE_URI }}
          tag: ${{ env.IMAGE_TAG }}
          overlay-path: argocd/discord-bot
          private-key: ${{ secrets.DEPLOYER_APP_PRIVATE_KEY }}
